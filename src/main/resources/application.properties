spring.application.name=Backend

# D1-B1: adding spring-boot-starter-security (and the oauth2-resource-server starter) makes
# Boot auto-configure a "secure everything with a generated password / a default JWT filter
# chain" in ANY context that doesn't otherwise supply its own SecurityFilterChain (e.g. an
# @WebMvcTest slice that doesn't @Import SecurityConfig) — that broke every one of Dev C's
# slice tests that assumed no security at all. Excluding both of Boot's own auto-configurations
# here does NOT weaken real security: SecurityConfig defines its own @Bean SecurityFilterChain
# AND @Bean JwtDecoder explicitly (see SecurityConfig.jwtDecoder()), entirely independent of
# these autoconfigurations, and both still apply everywhere SecurityConfig is loaded (the full
# app, and any test that imports it). This only removes the *fallback* that kicks in when
# nothing else is configured.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Loads .env (git-ignored) as regular properties for local `mvn spring-boot:run` — the
# [.properties] suffix is a format hint, not part of the real filename. "optional:" means
# boot still starts fine if .env is missing (e.g. in CI, where real env vars are set instead).
spring.config.import=optional:file:.env[.properties]

# MySQL — see .env.example. Defaults here match Day 0's local setup (docs/DEV_SETUP.md) so the
# app still boots against a stock `docker run mysql:8.4` even with no .env at all.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:protify}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway migrates against the same datasource on every boot — no separate config needed.
spring.flyway.enabled=true

server.port=${SERVER_PORT:8080}

# --- CSV transaction import (API_CONTRACT.md §8.1) ---------------------------
# Boot's own defaults are 1MB/10MB. These sit deliberately *above* the controller's own 2MB cap
# so an oversized upload is refused by TransactionController's check, which can say "at most
# 2 MB" against the `file` field, rather than by Tomcat, whose MaxUploadSizeExceededException
# knows nothing about which part was too big. The container limit is the backstop, not the rule.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# --- D1-B1: OAuth2 resource server (Google ID token as bearer, ADR-0004) ----
# Spring fetches Google's JWKS and validates signature, issuer, audience, expiry.
# GOOGLE_CLIENT_ID is public by design, not a secret (D0-B1).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_CLIENT_ID:}

# --- D1-B1: CORS ------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- D2-B1: market data / D2-B3: FX providers --------------------------------
marketdata.provider=${MARKET_DATA_PROVIDER:yahoo}
marketdata.twelvedata.api-key=${TWELVE_DATA_API_KEY:}
fx.provider=${FX_PROVIDER:frankfurter}

# --- D3-B1: admin-restricted price refresh -----------------------------------
admin.emails=${ADMIN_EMAILS:}

# --- D3-B4: health — a stale price/rate is a degradation, not an outage. DEGRADED must not
# drag the aggregate /actuator/health status down from UP (db genuinely down still must, which
# is why DOWN stays first); show-details=always so the demo/tests can see the per-component
# marketdata/fx status — /actuator/health has no sensitive data and is already permitAll.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN
management.endpoint.health.show-details=always

# --- D5-B2: insights (Java client + Python FastAPI service) ------------------
# Default false: Dev C's controller answers 501 (not 404 — API_CONTRACT.md §18) when off, and
# InsightsClient itself never calls the network when disabled either (defence in depth).
features.insights.enabled=${FEATURES_INSIGHTS_ENABLED:false}
insights.service.url=${INSIGHTS_SERVICE_URL:http://localhost:8000}
# Read timeout for the call INTO the Python service. Must exceed that service's own
# INSIGHTS_LLM_TIMEOUT_SECONDS (default 10) with margin, or this client gives up first and its
# Java fallback runs while the service is still waiting on the provider — the model answers
# into a closed connection and you pay for a summary nobody sees. Raise both together.
insights.client.timeout-ms=${INSIGHTS_CLIENT_TIMEOUT_MS:30000}

# --- i18n: on-demand translation for languages with no bundled catalogue -----
# Default false, and 501 (not 404) when off — same rule as insights, so a client can tell
# "this deployment does not translate" from "wrong URL". The nine bundled catalogues do NOT
# go through this: they are static files and stay free, instant and offline-correct.
# The flag alone is not enough — without an api-key there is nothing to call, so
# TranslationClient#isEnabled requires both and the endpoint honestly reports 501 otherwise.
# Same OpenAI-compatible chat-completions shape services/insights/main.py uses, so one
# provider serves both features.
features.translation.enabled=${FEATURES_TRANSLATION_ENABLED:false}
translation.llm.api-url=${TRANSLATION_LLM_API_URL:https://api.openai.com/v1/chat/completions}
translation.llm.api-key=${TRANSLATION_LLM_API_KEY:}
translation.llm.model=${TRANSLATION_LLM_MODEL:gpt-4o-mini}

