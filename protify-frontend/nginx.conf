# Rendered by the nginx image's envsubst entrypoint (this file is mounted as
# /etc/nginx/templates/default.conf.template), which is why ${PORT} below is a real
# substitution and not nginx syntax. Railway assigns a port per deploy and injects it as PORT;
# a container that hard-codes 80 is marked unhealthy and never receives traffic.
#
# Note $uri is NOT substituted: the entrypoint passes envsubst an explicit allow-list built from
# the actual environment, and `uri` is not an environment variable. Do not "fix" it by escaping.

server {
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints every file under /assets (name.<hash>.js), so the content at a given URL
    # can never change — cache it hard. index.html must NOT be cached this way or browsers keep
    # loading the previous deploy's asset URLs.
    # One header, not `expires 1y` plus an add_header — those emit two separate Cache-Control
    # lines and leave the effective policy up to the client to reconcile.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback. /portfolios/:id is a client-side react-router route with no file behind it —
    # without this, a hard refresh or a pasted deep link is a 404 from nginx before React ever
    # boots.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
