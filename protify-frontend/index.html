<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Protify — a multi-currency portfolio manager. Track holdings, performance and allocation across currencies in one place."
    />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M10 23V9h6.2a4.6 4.6 0 0 1 0 9.2H13' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>Protify — Portfolio Manager</title>

    <!--
      Preferences are applied before first paint. Doing this in React would mean one frame of the
      wrong theme on every load — the white flash that gives away a bolted-on dark mode. The keys
      here are the same ones `src/preferences/PreferencesContext.tsx` writes; if you rename one,
      rename it in both places.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var read = function (key, fallback) {
            try {
              return localStorage.getItem(key) || fallback;
            } catch (error) {
              return fallback;
            }
          };

          var theme = read('protify.theme', 'system');
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          root.setAttribute('data-theme', resolved);
          root.setAttribute('data-density', read('protify.density', 'comfortable'));
          root.setAttribute('data-motion', read('protify.motion', 'full'));

          var language = read('protify.language', 'en');
          root.setAttribute('lang', language);
          root.setAttribute('dir', ['ar', 'he', 'fa', 'ur'].indexOf(language) > -1 ? 'rtl' : 'ltr');
        } catch (error) {
          /* A blocked localStorage must never stop the app rendering. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
